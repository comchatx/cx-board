<!doctype html>
<html><head><meta charset="utf-8"><style>body { margin: 0; padding: var(--space-5); }</style></head>
<body class="kit"><div class="markdown" id="file"></div><script>
// A Markdown file of the seller's computer, drawn as cx's answers are by the board's own pipeline, each time the board hands it.
const box = document.getElementById("file");
let drawing = 0;
cxBoard.on("file", (file) => {
  const at = ++drawing;
  cxBoard.markdown(file.text ?? "").then((html) => { if (at === drawing) box.innerHTML = html; }, () => {});
});
</script></body></html>
