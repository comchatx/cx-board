<!doctype html>
<html><head><meta charset="utf-8"><style>body.kit { margin: 0; padding: 0; }
/* GitHub's file view, as github-markdown-css's readme sets it: centred, at most 980px, 45px round, 15px under 767px. */
.markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
@media (max-width: 767px) { .markdown-body { padding: 15px; } }</style></head>
<body class="kit"><article class="markdown-body" id="file"></article><script>
// A Markdown file of the seller's computer, drawn by the board's own pipeline and read whole under GitHub's rules, each time the board hands it.
const box = document.getElementById("file");
let drawing = 0;
cxBoard.on("file", (file) => {
  const at = ++drawing;
  cxBoard.markdown(file.text ?? "").then((html) => { if (at === drawing) box.innerHTML = html; }, () => {});
});
</script></body></html>
