<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.markdown img { max-width: 100%; height: auto; }
</style>
</head>
<body class="kit">
<div class="markdown" id="file"></div>
<script src="lib:mammoth/mammoth.browser.min.js"></script>
<script src="part:unreadable.js"></script>
<script>
const box = document.getElementById("file");
// A link is drawn as its words, so no link of the file's can run as the page.
const unlink = (element) => {
  if (Array.isArray(element.children)) element.children = element.children.flatMap((child) => (child.type === "hyperlink" ? child.children.map(unlink) : [unlink(child)]));
  return element;
};
const unlinked = (word) => {
  for (const note of Object.values(word.notes._notes)) note.body = note.body.map(unlink);
  return unlink(word);
};
let shown = 0;
cxBoard.on("file", async (file) => {
  const turn = ++shown;
  const bytes = Uint8Array.from(atob(file.bytes), (letter) => letter.charCodeAt(0));
  const html = await mammoth.convertToHtml({ arrayBuffer: bytes.buffer }, { transformDocument: unlinked }).then((done) => done.value, () => undefined);
  if (turn !== shown) return;
  if (html === undefined) box.replaceChildren(unreadable());
  else box.innerHTML = html;
});
</script>
</body>
</html>
